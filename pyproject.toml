[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crestron-setup"
version = "1.0.0"
description = "Cross-platform Crestron processor provisioning console"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
    "rich>=13.0",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
crestron-setup = "crestron_setup.cli:main"
