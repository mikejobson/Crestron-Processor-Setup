[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crestron-setup"
dynamic = ["version"]
description = "Cross-platform Crestron processor provisioning console"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mike Jobson", email = "mike@mikejobson.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "paramiko>=3.0",
    "rich>=13.0",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
crestron-setup = "crestron_setup.cli:main"

[project.urls]
Homepage = "https://github.com/mikejobson/Crestron-Processor-Setup"
Repository = "https://github.com/mikejobson/Crestron-Processor-Setup"
Issues = "https://github.com/mikejobson/Crestron-Processor-Setup/issues"

[tool.setuptools.packages.find]
include = ["crestron_setup*"]

[tool.setuptools.package-data]
crestron_setup = ["welcome_animation.json"]

[tool.setuptools_scm]
write_to = "crestron_setup/_version.py"
