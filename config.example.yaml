# Default configuration for Crestron processor setup.
# Copy to ~/.config/crestron-setup/config.yaml (macOS/Linux)
#       or %APPDATA%\crestron-setup\config.yaml (Windows)

# ─── SSH Connection ─────────────────────────────────────────────────────────
# Default username for SSH connections (pre-filled in prompts, leave blank to always ask)
# default_username: "admin"

# Try SSH key authentication before prompting for password (default: true)
# Uses SSH agent keys (macOS Keychain, ssh-agent, 1Password, etc.) and ~/.ssh/ key files.
# If key auth fails, falls back to password prompt automatically.
ssh_key_auth: true

# ─── Provisioning ──────────────────────────────────────────────────────────

# Timezone ID to set on processors (use TIMEZONE LIST on a processor to see options)
timezone: "33" # 33 = GMT Standard Time

# NTP server for time synchronisation
ntp_server: "pool.ntp.org"

# SSH public key file to upload to processors (local path or URL)
# Examples:
#   pubkey_file: "~/.ssh/id_rsa.pub"
#   pubkey_file: "https://github.com/username.keys"
pubkey_file: "~/.ssh/id_rsa.pub"

# Local directory to search for .puf firmware files (fallback if no download URL)
firmware_dir: "~/Downloads"

# Web server ports
web_port: 8080
secure_web_port: 8443

# Login lockout policy
user_login_attempts: 5
user_lockout_time: "1m"
login_attempts: 20
lockout_time: "5m"

# FIPS mode (ON or OFF)
fips_mode: "OFF"

# Firmware download URLs per model.
# These are checked when running firmware updates. Leave empty or remove
# entries for models where you provide firmware files locally.
# Supports optional auth headers — see examples below.
firmware_urls:
  # CP4:
  #   url: "https://example.com/firmware/cp4_latest.puf"
  #   headers:
  #     Authorization: "Bearer YOUR_TOKEN_HERE"
  # MC4:
  #   url: "https://example.com/firmware/mc4_latest.puf"
  # CP4N:
  #   url: "https://example.com/firmware/cp4n_latest.puf"
  # RMC4:
  #   url: "https://example.com/firmware/rmc4_latest.puf"

# ─── Firmware Server API ──────────────────────────────────────────────────
# Instead of (or in addition to) per-model firmware_urls above, you can
# configure a firmware server that serves metadata via a JSON API.
#
# The app queries:  {firmware_server}/{MODEL}/latest.json
#
# Expected JSON response:
#   {
#     "version": "2.8006.00284.01",
#     "originalFileName": "mc4_2.8006.00284.01.puf",
#     "fileHash": "8377fadb...",           (SHA256 hex digest)
#     "fileSizeBytes": 318169239,
#     "compatibleModels": ["MC4"],
#     "downloadUrl": "https://...signed-url..."
#   }
#
# Benefits over direct URLs:
#   - Version check without downloading the full .puf file
#   - SHA256 hash verification after download
#   - Supports signed/temporary download URLs
#
# firmware_server: "https://example.com/api/firmware/public"

# DNS servers pushed by "Apply Common Settings" (bulk DNS/NTP/timezone push).
# Also used as the default when that flow prompts for DNS servers.
# dns_servers:
#   - 10.0.0.1
#   - 10.0.0.2

# Discovery settings
discovery:
  timeout: 5 # Seconds to listen for responses
  broadcast_count: 3 # Number of broadcast packets to send
  # First-boot check that runs against every discovered device.
  probe_timeout: 10 # Per-device budget in seconds (web check, then SSH)
  probe_workers: 16 # Devices probed in parallel — raise for large estates

# ─── Configuration Profiles ───────────────────────────────────────────────
# Profiles let you customise provisioning per device type.
# Top-level settings above act as the "default" profile.
# Each profile can:
#   - Override a setting with a new value
#   - Set a setting to false to skip that command entirely
#   - Add custom commands via extra_commands
#   - Auto-match devices by model name using glob patterns
#
# Omitted settings inherit from the defaults above.
profiles:
  # Example: touch panels don't need web port or FIPS changes
  # touch-panels:
  #   models: ["TSW-*", "TS-*"]
  #   web_port: false
  #   secure_web_port: false
  #   fips_mode: false
  #   extra_commands:
  #     - command: "PROGCOMMENTS OFF"
  #       label: "Disable program comments"

  # Example: locked-down processors with stricter security
  # locked-down:
  #   models: ["CP4*", "MC4*", "PRO4*"]
  #   fips_mode: "ON"
  #   user_login_attempts: 3
  #   user_lockout_time: "30m"
  #   login_attempts: 5
  #   lockout_time: "1h"
  #   extra_commands:
  #     - command: "SSHD ROOTALIAS OFF"
  #       label: "Disable root alias"

# ─── CSR Defaults ─────────────────────────────────────────────────────────
# Default values for Certificate Signing Request generation.
# These are reused across devices so you don't have to type them each time.
# csr_defaults:
#   country: "GB"
#   state: "England"
#   locality: "London"
#   organization: "Acme Corp"
#   organizational_unit: "AV"
#   email: "av@acme.com"

# ─── Certificate Paths ────────────────────────────────────────────────────
# File paths for certificate deployment to devices.
# certificates:
#   cert_file: "/path/to/wildcard.pfx"       # .pem, .cer, .crt, .pfx, .p12
#   intermediate_file: "/path/to/intermediate.pem"
#   root_ca_file: "/path/to/root-ca.pem"
