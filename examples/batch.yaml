# Batch provisioning device list
# Each device needs at minimum a hostname or ip.
# Optional fields: username, password, profile
#
# Devices without credentials will use the shared credentials
# prompted at runtime. Devices without a profile will use the
# shared profile selection.

devices:
  - hostname: 192.168.1.10
    username: admin
    password: admin
    profile: default

  - hostname: 192.168.1.11
    username: admin
    password: admin
    profile: default

  - hostname: 192.168.1.20
    profile: touch-panel

  # Simple entry — just a hostname
  - hostname: 192.168.1.30
