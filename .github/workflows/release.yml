name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── Build sdist + wheel ────────────────────────────────────────────────
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI (Trusted Publisher OIDC) ───────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── Build standalone executables ───────────────────────────────────────
  build-executables:
    name: Build ${{ matrix.os }} executable
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: crestron-setup-macos
            binary: crestron-setup
          - os: windows-latest
            artifact: crestron-setup-windows
            binary: crestron-setup.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install . pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --name crestron-setup
          --collect-submodules crestron_setup
          crestron_setup/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  # ── Create GitHub Release ──────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build-executables, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir release
          cp artifacts/crestron-setup-macos/crestron-setup release/crestron-setup-macos
          cp artifacts/crestron-setup-windows/crestron-setup.exe release/crestron-setup-windows.exe
          cd release && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  # ── Bump Homebrew formula ──────────────────────────────────────────────
  bump-homebrew:
    name: Update Homebrew tap
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: crestron-setup
          homebrew-tap: mikejobson/homebrew-tap
          download-url: https://github.com/mikejobson/Crestron-Processor-Setup/releases/download/${{ github.ref_name }}/crestron-setup-macos
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # ── Update Scoop bucket ──────────────────────────────────────────────
  bump-scoop:
    name: Update Scoop bucket
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crestron-setup-windows
          path: artifacts/

      - name: Calculate SHA256
        id: hash
        run: echo "sha256=$(sha256sum artifacts/crestron-setup.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: mikejobson/scoop
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: scoop-bucket

      - name: Update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HASH="${{ steps.hash.outputs.sha256 }}"
          URL="https://github.com/mikejobson/Crestron-Processor-Setup/releases/download/${TAG}/crestron-setup-windows.exe"
          jq -n \
            --arg v "$VERSION" \
            --arg url "$URL" \
            --arg hash "$HASH" \
            '{
              version: $v,
              description: "Cross-platform Crestron processor provisioning console",
              homepage: "https://github.com/mikejobson/Crestron-Processor-Setup",
              license: "MIT",
              url: $url,
              hash: $hash,
              bin: [["crestron-setup-windows.exe", "crestron-setup"]],
              checkver: "github",
              autoupdate: {
                url: "https://github.com/mikejobson/Crestron-Processor-Setup/releases/download/v$version/crestron-setup-windows.exe"
              }
            }' > scoop-bucket/bucket/crestron-setup.json

      - name: Commit and push
        working-directory: scoop-bucket
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/crestron-setup.json
          git diff --cached --quiet && exit 0
          git commit -m "Update crestron-setup to ${GITHUB_REF_NAME#v}"
          git push

  # ── Submit to Windows Package Manager ────────────────────────────────
  bump-winget:
    name: Update Winget manifest
    needs: github-release
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: mikejobson.CrestronSetup
          installers-regex: crestron-setup-windows\.exe$
          token: ${{ secrets.WINGET_TOKEN }}
