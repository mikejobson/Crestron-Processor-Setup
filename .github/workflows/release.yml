name: Release

on:
  push:
    tags:
      - "v*"
  # Manual re-run of a release for a tag that already exists. The version is
  # derived from the tag by setuptools-scm, so a tag is required either way —
  # this only lets you re-drive the pipeline without pushing a new tag (e.g.
  # after a transient failure or an expired tap token).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.1.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ── Resolve which tag we are releasing ─────────────────────────────────
  # On a tag push this is the pushed tag; on a manual run it is the input.
  # Every downstream job checks out this ref so setuptools-scm resolves a
  # real version, and uses it for release/download URLs.
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify the tag
        id: resolve
        env:
          # Via env, not direct interpolation, so the input cannot inject shell
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Refusing to release '$TAG' — must start with 'v'"; exit 1 ;;
          esac
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' does not exist in this repository"
            exit 1
          fi
          echo "Releasing $TAG ($(git rev-parse --short "refs/tags/$TAG"))"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── Build sdist + wheel ────────────────────────────────────────────────
  build-wheel:
    name: Build wheel
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0 # setuptools-scm needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI (Trusted Publisher OIDC) ───────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── Build standalone executables ───────────────────────────────────────
  build-executables:
    name: Build ${{ matrix.os }} executable
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: crestron-setup-macos
            binary: crestron-setup
          - os: windows-latest
            artifact: crestron-setup-windows
            binary: crestron-setup.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install . pyinstaller

      - name: Build executable
        shell: bash
        run: |
          sep=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then sep=";"; fi
          pyinstaller \
            --onefile \
            --name crestron-setup \
            --collect-submodules crestron_setup \
            --add-data "crestron_setup/welcome_animation.json${sep}crestron_setup" \
            crestron_setup/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  # ── Create GitHub Release ──────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [resolve-tag, build-executables, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir release
          cp artifacts/crestron-setup-macos/crestron-setup release/crestron-setup-macos
          cp artifacts/crestron-setup-windows/crestron-setup.exe release/crestron-setup-windows.exe
          cd release && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          generate_release_notes: true
          files: release/*

  # ── Bump Homebrew formula ──────────────────────────────────────────────
  bump-homebrew:
    name: Update Homebrew tap
    needs: [resolve-tag, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: crestron-setup
          homebrew-tap: mikejobson/homebrew-tap
          download-url: https://github.com/mikejobson/Crestron-Processor-Setup/releases/download/${{ needs.resolve-tag.outputs.tag }}/crestron-setup-macos
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # ── Update Scoop bucket ──────────────────────────────────────────────
  bump-scoop:
    name: Update Scoop bucket
    needs: [resolve-tag, github-release]
    runs-on: ubuntu-latest
    env:
      # Job-level so both the manifest and the commit step see it
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crestron-setup-windows
          path: artifacts/

      - name: Calculate SHA256
        id: hash
        run: echo "sha256=$(sha256sum artifacts/crestron-setup.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: mikejobson/scoop
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: scoop-bucket

      - name: Update manifest
        run: |
          VERSION="${TAG#v}"
          HASH="${{ steps.hash.outputs.sha256 }}"
          URL="https://github.com/mikejobson/Crestron-Processor-Setup/releases/download/${TAG}/crestron-setup-windows.exe"
          jq -n \
            --arg v "$VERSION" \
            --arg url "$URL" \
            --arg hash "$HASH" \
            '{
              version: $v,
              description: "Cross-platform Crestron processor provisioning console",
              homepage: "https://github.com/mikejobson/Crestron-Processor-Setup",
              license: "MIT",
              url: $url,
              hash: $hash,
              bin: [["crestron-setup-windows.exe", "crestron-setup"]],
              checkver: "github",
              autoupdate: {
                url: "https://github.com/mikejobson/Crestron-Processor-Setup/releases/download/v$version/crestron-setup-windows.exe"
              }
            }' > scoop-bucket/bucket/crestron-setup.json

      - name: Commit and push
        working-directory: scoop-bucket
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/crestron-setup.json
          git diff --cached --quiet && exit 0
          git commit -m "Update crestron-setup to ${TAG#v}"
          git push
