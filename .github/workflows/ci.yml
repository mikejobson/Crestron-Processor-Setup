name: CI

# Checks only — nothing here publishes. Releasing stays in release.yml,
# which is triggered exclusively by pushing a v* tag.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static checks ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Byte-compile every module
        run: python -m compileall -q crestron_setup

      - name: Check the legacy bash script parses
        run: bash -n setup_processor.sh

      # config.example.yaml is validated in the test job, which has pyyaml:
      # tests/test_config.py checks it parses *and* that the loader honours
      # every key in it. Keeping this job dependency-free keeps it fast.

  # ── Tests ──────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs full history for the version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q

  # ── Packaging (build only, never uploaded) ─────────────────────────────
  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Check package data ships in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [n for n in ("crestron_setup/welcome_animation.json",)
                     if n not in names]
          if missing:
              sys.exit(f"missing from {wheel}: {missing}")
          print(f"{wheel}: package data present")
          PY

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "import crestron_setup.cli; print('wheel imports OK')"
          test -x /tmp/verify/bin/crestron-setup

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
